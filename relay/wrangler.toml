# Optional: deploy with `npx wrangler deploy` from this folder instead of pasting worker.js in the
# dashboard (docs/online.md). Create the KV namespace first and put its id below, then set the
# secret with `npx wrangler secret put RELAY_SECRET`.
name = "handprinter"
main = "worker.js"
compatibility_date = "2024-09-01"
workers_dev = true

[[kv_namespaces]]
binding = "RELAY"
id = "PUT-YOUR-KV-NAMESPACE-ID-HERE"
