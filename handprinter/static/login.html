<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Handprinter</title>
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <script type="module" src="/static/js/login.js"></script>
</head>
<body>
  <main class="state state--center">
    <h1>Handprinter</h1>
    <p class="muted">LAN access is enabled on this machine. Enter the access token from its <code>.env</code> file.</p>
    <form id="login" class="stack">
      <label class="field"><span>Access token</span><input id="token" type="password" autocomplete="current-password" required></label>
      <button class="btn btn--primary" type="submit">Sign in</button>
      <p id="error" class="small" role="alert"></p>
    </form>
  </main>
</body>
</html>
